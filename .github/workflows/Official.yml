#
# 请大家记住拉取的是我的 281677160/build-actions 仓库，拉取的是其他仓库有问题，别问我，我也不清楚什么问题
#
# 因为SSH连接配置固件直接编译，会给github停止编译的,所以要另外触发启动编译程序
#
# 一般情况下都能触发启动编译的，除非没设置好密匙，或者密匙过期了，或者密匙错误之类的
#
# REPO_TOKEN密匙制作教程：https://git.io/jm.md
#
# 实验性:本文件已改为薄 caller,共享步骤在 _launcher.yml(reusable workflow)。
# 先用 Official 验证 reusable 方案,验证通过后再铺开到其他源码。
#

name: Official-官方
on:
  workflow_dispatch:
    inputs:
      REPO_BRANCH:
        description: '（官方源码）请选择源码分支'
        required: true
        default: 'openwrt-24.10'
        type: choice
        options:
          - 'openwrt-24.10'
          - 'openwrt-23.05'
          - 'master'
          - 'main'
      CONFIG_FILE:
        description: '请选择配置文件'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - 'armsr_rootfs_tar_gz'
          - 'phicomm_k3'
          - 'x86_64'
      INFORMATION_NOTICE:
        description: 'Telegram或pushplus信息通知'
        required: true
        default: '关闭'
        type: choice
        options:
          - '关闭'
          - 'Telegram'
          - 'Pushplus'
      KEEP_WORKFLOWS:
        description: '清理workflows,保留[X]个runs不被清理'
        required: true
        default: '50'
      KEEP_RELEASES:
        description: '清理Releases,保留[X]个Releases不被清理'
        required: true
        default: '30'
      SSH_ACTION:
        description: 'SSH远程配置固件'
        required: false
        default: 'false'
        type: boolean
      UPLOAD_FIRMWARE:
        description: '上传固件到 Github Artifacts'
        required: false
        default: 'true'
        type: boolean
      UPLOAD_RELEASE:
        description: '发布固件到 Github Releases'
        required: false
        default: 'false'
        type: boolean
      CACHEWRTBUILD_SWITCH:
        description: '缓存加速编译'
        required: false
        default: 'true'
        type: boolean
      UPDATE_FIRMWARE_ONLINE:
        description: '在线更新固/打包aarch64系列为img固件'
        required: false
        default: 'true'
        type: boolean


# 如若启动定时编译的话,配置文件是设置对应文件夹内的settings.ini文件
# 定时触发开启开始编译(把下面两个#去掉开启,时间设置请看定时开启编译说明)
#  schedule:
#   - cron: 35 18 * * *

jobs:
  build:
    uses: ./.github/workflows/_launcher.yml
    secrets: inherit
    with:
      target: Official
      REPO_BRANCH: ${{ inputs.REPO_BRANCH }}
      CONFIG_FILE: ${{ inputs.CONFIG_FILE }}
      INFORMATION_NOTICE: ${{ inputs.INFORMATION_NOTICE }}
      KEEP_WORKFLOWS: ${{ inputs.KEEP_WORKFLOWS }}
      KEEP_RELEASES: ${{ inputs.KEEP_RELEASES }}
      SSH_ACTION: ${{ inputs.SSH_ACTION == 'true' }}
      UPLOAD_FIRMWARE: ${{ inputs.UPLOAD_FIRMWARE == 'true' }}
      UPLOAD_RELEASE: ${{ inputs.UPLOAD_RELEASE == 'true' }}
      CACHEWRTBUILD_SWITCH: ${{ inputs.CACHEWRTBUILD_SWITCH == 'true' }}
      UPDATE_FIRMWARE_ONLINE: ${{ inputs.UPDATE_FIRMWARE_ONLINE == 'true' }}
